pdf-engine: tectonic
from: markdown+pipe_tables+tex_math_dollars
to: pdf
standalone: true
toc: true
toc-depth: 2
number-sections: true
variables:
  geometry:
    - a4paper
    - top=20mm
    - bottom=20mm
    - left=20mm
    - right=20mm
  fontsize: 10pt
  linestretch: 1.12
  colorlinks: true
  linkcolor: engineBlue
  urlcolor: engineBlue
  header-includes:
    - |-
      \usepackage{amsmath}
      \usepackage{booktabs}
      \usepackage{longtable}
      \usepackage{array}
      \usepackage{fancyhdr}
      \usepackage{xcolor}
      \definecolor{engineBlue}{HTML}{1F4E79}
      \definecolor{enginePale}{HTML}{EAF1F8}
      \pagestyle{fancy}
      \fancyhf{}
      \lhead{\footnotesize\color{engineBlue}FPO DPR — Financial Engine}
      \rhead{\footnotesize\color{engineBlue}\thepage}
      \renewcommand{\headrulewidth}{0.4pt}
      \renewcommand{\headrule}{\hbox to\headwidth{\color{engineBlue}\leaders\hrule height \headrulewidth\hfill}}
      \AtBeginEnvironment{longtable}{\small}
      \setlength{\tabcolsep}{5pt}
